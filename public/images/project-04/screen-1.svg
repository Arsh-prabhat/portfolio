<svg width="1000" height="600" viewBox="0 0 1000 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="600" fill="#0F1115"/>
  <rect x="20" y="20" width="960" height="560" rx="12" fill="#16181D" stroke="#262930" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="6" fill="#ED6A5E"/>
  <circle cx="64" cy="44" r="6" fill="#F5BF4F"/>
  <circle cx="84" cy="44" r="6" fill="#62C554"/>
  <text x="500" y="48" font-family="sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Design System — Token Hierarchy & Variant Matrix</text>
  <line x1="20" y1="64" x2="980" y2="64" stroke="#262930" stroke-width="1"/>

  <g transform="translate(80, 100)">
    <rect width="840" height="420" rx="12" fill="#1C1F26" stroke="#333842" stroke-width="2"/>
    <text x="40" y="50" font-family="sans-serif" font-size="16" font-weight="bold" fill="#A78BFA">Color Token Alias Map</text>
    
    <!-- Token Row 1 -->
    <rect x="40" y="80" width="760" height="50" rx="8" fill="#252A34"/>
    <text x="60" y="110" font-family="monospace" font-size="12" fill="#38BDF8">sys.color.brand.primary</text>
    <text x="320" y="110" font-family="sans-serif" font-size="12" fill="#9CA3AF">→ alias: color.blue.500</text>
    <rect x="720" y="93" width="60" height="24" rx="4" fill="#0EA5E9"/>

    <!-- Token Row 2 -->
    <rect x="40" y="145" width="760" height="50" rx="8" fill="#252A34"/>
    <text x="60" y="175" font-family="monospace" font-size="12" fill="#A78BFA">sys.color.surface.chrome</text>
    <text x="320" y="175" font-family="sans-serif" font-size="12" fill="#9CA3AF">→ alias: color.slate.900 (blur: 12px)</text>
    <rect x="720" y="158" width="60" height="24" rx="4" fill="#1E293B"/>

    <!-- Token Row 3 -->
    <rect x="40" y="210" width="760" height="50" rx="8" fill="#252A34"/>
    <text x="60" y="240" font-family="monospace" font-size="12" fill="#34D399">sys.color.state.success</text>
    <text x="320" y="240" font-family="sans-serif" font-size="12" fill="#9CA3AF">→ alias: color.emerald.500</text>
    <rect x="720" y="223" width="60" height="24" rx="4" fill="#10B981"/>
  </g>
</svg>
