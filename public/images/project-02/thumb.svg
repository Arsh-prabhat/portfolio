<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#121316"/>
  <defs>
    <pattern id="dot-pattern-2" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="grad-delivery" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#dot-pattern-2)"/>
  <rect width="800" height="500" fill="url(#grad-delivery)"/>

  <!-- Dispatch Frame -->
  <rect x="220" y="50" width="360" height="400" rx="20" fill="#181B22" stroke="#10B981" stroke-width="2"/>
  <!-- Top Map Route Line -->
  <path d="M260 120 C320 90, 420 180, 540 130" stroke="#10B981" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="260" cy="120" r="8" fill="#10B981"/>
  <circle cx="540" cy="130" r="8" fill="#F59E0B"/>

  <!-- High-Contrast Dispatch Alert Box -->
  <rect x="250" y="200" width="300" height="220" rx="16" fill="#222732" stroke="#374151" stroke-width="2"/>
  <text x="400" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">NEW DISPATCH ALERT • 00:45</text>
  <text x="400" y="270" font-family="sans-serif" font-size="20" font-weight="bold" fill="#F3F4F6" text-anchor="middle">₹145.00 • 3.2 km</text>
  
  <!-- Swipe Target Button -->
  <rect x="270" y="320" width="260" height="56" rx="28" fill="#065F46" stroke="#10B981" stroke-width="2"/>
  <circle cx="300" cy="348" r="22" fill="#10B981"/>
  <text x="300" y="354" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">→</text>
  <text x="420" y="353" font-family="sans-serif" font-size="14" font-weight="bold" fill="#A7F3D0" text-anchor="middle">SWIPE TO ACCEPT</text>
  
  <!-- Label -->
  <rect x="220" y="24" width="160" height="18" rx="3" fill="#10B981"/>
  <text x="228" y="37" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Delivery App / Dispatch</text>
</svg>
